# Weekly database backup. Supabase's free plan has no managed backups and pauses idle projects;
# this job also keeps the project active.
# Needs repo secrets: SUPABASE_DB_URL (Supabase → Connect → Session pooler URI) and
# BACKUP_PASSPHRASE (any long password; the dump is encrypted with it, since artifacts may be downloadable).
# Restore: gpg -d backup.sql.gz.gpg | gunzip | psql "<db url>"
name: Weekly DB backup

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: echo "ready=$([ -n "$DB" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install Postgres 17 client
        if: steps.check.outputs.ready == 'yes'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'yes'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth --schema=storage | gzip > backup.sql.gz
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c backup.sql.gz
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          name: pawfolio-backup-${{ github.run_number }}
          path: backup.sql.gz.gpg
          retention-days: 90
